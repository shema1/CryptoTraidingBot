[project]
name = "crypto-trading-bot-backend"
version = "0.0.0"
description = "Бекенд Crypto Trading Bot: торговий процес, воркер, колектор (ТЗ §3, §6.4)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Залежності додаються лише тими задачами, яким вони потрібні (AGENTS.md), версії фіксує uv.lock.
dependencies = [
    "alembic>=1.14,<2", # міграції схеми БД (migrations/, T0.4)
    "asyncpg>=0.30,<1", # async-драйвер PostgreSQL для SQLAlchemy (T0.4)
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3", # конфіг з .env (core/config.py, T0.1/T0.3)
    "sqlalchemy[asyncio]>=2.0.36,<2.1", # моделі БД і async-сесії (app/core/db.py, T0.4)
    "structlog>=25.1,<26", # JSON-логи з маскуванням секретів (core/logging.py, T0.3)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112", # property-based тести (округлення, sizing, машина станів)
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pyyaml>=6.0", # scripts/sync_ai_rules.py у pre-commit
    "types-pyyaml>=6.0",
    "pytest-asyncio>=0.24", # async integration-тести з БД (tests/db, T0.4)
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "S",            # bandit (безпека)
    "DTZ",          # заборона naive datetime (ТЗ §4.3: лише UTC мс)
    "BLE",          # заборона «голого» except Exception без обробки
    "T20",          # заборона print (лише structlog)
    "C4", "SIM", "PT", "ASYNC", "RUF",
    "TID",          # banned-api: час лише через app.core.clock (ТЗ §4.3)
]
# RUF001–003: кирилиця в рядках/коментарях — не помилка, документація українською.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert у тестах
# Вигадані «секрети» в тестах маскування (T0.3); реальних ключів у тестах немає. Лише ці файли.
"tests/test_logging.py" = ["S101", "S105", "S106"]
"tests/test_config.py" = ["S101", "S105", "S106"]
# Згенеровані міграції: SQL-тексти CHECK з моделей не переносяться (T0.4).
"migrations/versions/**" = ["E501"]
# Єдине місце, де читається реальний час.
"app/core/clock.py" = ["TID251"]
"tests/test_clock.py" = ["TID251"]

# Прямий доступ до часу заборонено: лише app.core.clock (now_ms / monotonic_ms), щоб тести підміняли годинник.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "Використовуйте app.core.clock.now_ms() (ТЗ §4.3)"
"time.time_ns".msg = "Використовуйте app.core.clock.now_ms() (ТЗ §4.3)"
"time.monotonic".msg = "Використовуйте app.core.clock.monotonic_ms()"
"time.monotonic_ns".msg = "Використовуйте app.core.clock.monotonic_ms()"
"time.perf_counter".msg = "Використовуйте app.core.clock.monotonic_ms()"
"datetime.datetime.now".msg = "Використовуйте app.core.clock.now_ms() (ТЗ §4.3)"
"datetime.datetime.utcnow".msg = "Використовуйте app.core.clock.now_ms() (ТЗ §4.3)"
"datetime.datetime.today".msg = "Використовуйте app.core.clock.now_ms() (ТЗ §4.3)"
"datetime.date.today".msg = "Використовуйте app.core.clock.now_ms() (ТЗ §4.3)"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["app", "tests", "migrations/env.py"]
# Модулі рахуються від apps/backend (`tests.db.conftest` ≠ `tests.conftest`).
mypy_path = "."
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true

# Строгий режим для торгового ядра (ТЗ §14, AGENTS.md). `strict` не можна задати per-module,
# тому перелічено всі прапорці, які він вмикає.
[[tool.mypy.overrides]]
module = [
    "app.exchange.*",
    "app.trading.*",
    "app.risk.*",
    "app.protection.*",
    "app.reconcile.*",
    "app.core.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
extra_checks = true

# asyncpg не має вбудованих типів (py.typed): з'єднання lock (core/instance_lock.py) типізоване протоколом
# `LockConnection`, тому окремі стаби не додаються.
[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."] # `package = false`: пакет `app` береться з кореня apps/backend
# Мережеві тести (testnet, demo) за замовчуванням вимкнені; вмикаються явно: `uv run pytest -m testnet`
# (останній `-m` у командному рядку перекриває цей).
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not testnet and not demo"]
xfail_strict = true
# Async-тести позначаються явно `@pytest.mark.asyncio` (strict); кожен тест — власний цикл подій.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "unit: швидкий ізольований тест без мережі та БД (ставиться автоматично, якщо немає іншого маркера)",
    "integration: потрібна локальна тестова БД (docker compose)",
    "testnet: реальні виклики Bybit Testnet; ніколи mainnet",
    "demo: реальні виклики Bybit Demo Trading",
    "slow: повільний тест",
    "chaos: chaos-сценарії (ТЗ §18.2)",
]
