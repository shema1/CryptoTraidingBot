[project]
name = "crypto-trading-bot-backend"
version = "0.0.0"
description = "Бекенд Crypto Trading Bot: торговий процес, воркер, колектор (ТЗ §3, §6.4)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Залежності додаються лише тими задачами, яким вони потрібні (AGENTS.md), версії фіксує uv.lock.
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3", # конфіг з .env (core/config.py, T0.1/T0.3)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112", # property-based тести (округлення, sizing, машина станів)
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pyyaml>=6.0", # scripts/sync_ai_rules.py у pre-commit
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "S",            # bandit (безпека)
    "DTZ",          # заборона naive datetime (ТЗ §4.3: лише UTC мс)
    "BLE",          # заборона «голого» except Exception без обробки
    "T20",          # заборона print (лише structlog)
    "C4", "SIM", "PT", "ASYNC", "RUF",
]
# RUF001–003: кирилиця в рядках/коментарях — не помилка, документація українською.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert у тестах

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true

# Строгий режим для торгового ядра (ТЗ §14, AGENTS.md). `strict` не можна задати per-module,
# тому перелічено всі прапорці, які він вмикає.
[[tool.mypy.overrides]]
module = [
    "app.exchange.*",
    "app.trading.*",
    "app.risk.*",
    "app.protection.*",
    "app.reconcile.*",
    "app.core.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
extra_checks = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."] # `package = false`: пакет `app` береться з кореня apps/backend
# Мережеві тести (testnet, demo) за замовчуванням вимкнені; вмикаються явно: `uv run pytest -m testnet`
# (останній `-m` у командному рядку перекриває цей).
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not testnet and not demo"]
xfail_strict = true
markers = [
    "unit: швидкий ізольований тест без мережі та БД (ставиться автоматично, якщо немає іншого маркера)",
    "integration: потрібна локальна тестова БД (docker compose)",
    "testnet: реальні виклики Bybit Testnet; ніколи mainnet",
    "demo: реальні виклики Bybit Demo Trading",
    "slow: повільний тест",
    "chaos: chaos-сценарії (ТЗ §18.2)",
]
