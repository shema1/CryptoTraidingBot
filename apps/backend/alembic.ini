# Alembic (T0.4). DSN тут НЕ задається: env.py бере його з app.core.config.Settings (.env у корені),
# щоб пароль не потрапив у файл, що комітиться. Тестова БД: `uv run alembic -x db=test upgrade head`.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Номер ревізії задається явно: `uv run alembic revision --autogenerate --rev-id 0002 -m "..."`.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
